name: Node.js Continuous Integration

# 1. Trigger this automation whenever someone creates a PR targeting 'develop'
on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 2. Tell the robot to copy your repository code into its virtual environment
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 3. Set up the specific version of Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 4. Install your project's dependencies
    - name: Install dependencies
      run: npm ci

    # 5. Run your automated test suite
    - name: Run project tests
      run: npm test
